[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimetic"
version = "0.1.0b1"
description = "Mimetic beta : rendu de réverbération wet parallèle pour ADR, servi sur le LAN"
requires-python = ">=3.11"
# Versions testées sur la machine de développement (Python 3.11.9, Windows 10).
dependencies = [
  "numpy==2.2.6",
  "scipy==1.13.1",
  "soundfile==0.12.1",
  "fastapi==0.111.0",
  "uvicorn==0.30.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mimetic.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
